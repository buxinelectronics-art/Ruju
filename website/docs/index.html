<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: auto; padding: 16px; }
  input, textarea, select, button { box-sizing: border-box; font: inherit; padding: 9px; margin: 4px 0; }
  input, textarea, select { width: 100%; }
  button { cursor: pointer; }
  nav button.on { font-weight: bold; border-width: 3px; }
  .box { border: 1px solid #8888; border-radius: 8px; padding: 12px; margin: 12px 0; }
  .box p { white-space: pre-wrap; overflow-wrap: anywhere; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 1 1 120px; }
  .checks label { display: inline-flex; align-items: center; gap: 6px; width: auto; margin-right: 10px; }
  .checks input { width: auto; margin: 0; }
  small { color: #555; }
</style>
</head>
<body>
<h2>Admin Dashboard</h2>

<form id="login">
  <input id="password" type="password" placeholder="Admin password" required>
  <button>Log in</button>
</form>

<div id="app" hidden>
  <nav>
    <button id="tabDevices" class="on">Devices</button>
    <button id="tabContent">Content</button>
    <button id="tabApi">API &amp; Test</button>
  </nav>

  <section id="devices">
    <form id="add" class="box">
      <input id="name" placeholder="Device name" required>
      <button>Add device</button>
      <p id="newDevice"></p>
    </form>
    <div id="list"></div>
  </section>

  <section id="content" hidden>
    <div class="box">
      <b>Adhan MP3</b>
      <p id="adhanStatus">Loading…</p>
      <label>adhan.mp3 (Dhuhr / Asr / Maghrib / Isha)
        <input id="fileAdhan" type="file" accept="audio/mpeg,.mp3">
      </label>
      <button type="button" id="uploadAdhan">Upload adhan.mp3</button>
      <label>fajr.mp3 (Fajr only)
        <input id="fileFajr" type="file" accept="audio/mpeg,.mp3">
      </label>
      <button type="button" id="uploadFajr">Upload fajr.mp3</button>
      <small>Files are saved to GitHub docs/adhan/ for Pages. Max 5 MB each.</small>
    </div>
  </section>

  <section id="api" hidden>
    <form id="config" class="box">
      <b>OpenAI settings</b> <span id="keyState"></span>
      <input id="api_key" type="password" placeholder="OpenAI API key (leave empty to keep)" autocomplete="off">
      <label>Chat model<input id="chat_model"></label>
      <label>Speech-to-text model<input id="stt_model"></label>
      <label>Text-to-speech model<input id="tts_model"></label>
      <label>Voice<select id="voice">
        <option>alloy</option><option>ash</option><option>coral</option><option>echo</option>
        <option>nova</option><option>onyx</option><option>sage</option><option>shimmer</option>
      </select></label>
      <label>AI instructions<textarea id="instructions" rows="5"></textarea></label>
      <button>Save</button>
    </form>
    <div class="box">
      <b>Test</b>
      <input id="text" value="Hi" maxlength="300">
      <button id="send">Send to AI</button>
      <button id="speak">Speak (test voice)</button>
      <p id="reply"></p>
      <audio id="player" controls hidden></audio>
    </div>
  </section>
</div>
<p id="msg"></p>

<script>
// Change this to your Render address (no slash at the end). Never put the API key in this file.
const API = "https://ruju-zxb0.onrender.com";
const $ = id => document.getElementById(id);
const FIELDS = ["chat_model", "stt_model", "tts_model", "voice", "instructions"];
const DEVICE_FIELDS = [
  "content_url", "timezone", "latitude", "longitude", "method", "asr", "high_lat",
  "adj_fajr", "adj_sunrise", "adj_dhuhr", "adj_asr", "adj_maghrib", "adj_isha",
  "volume", "reciter"
];
const PRAYER_FIELDS = ["prayer_fajr", "prayer_dhuhr", "prayer_asr", "prayer_maghrib", "prayer_isha"];
let password = "";
let meta = { methods: ["MWL", "ISNA", "Egypt", "UmmAlQura", "Karachi"],
             asr_options: ["Shafi", "Hanafi"], high_lat: ["None", "MidNight", "OneSeventh", "AngleBased"] };

async function call(path, method = "GET", body) {
  const r = await fetch(API + "/api/admin" + path, {
    method,
    headers: { "Content-Type": "application/json", "X-Admin-Password": password },
    body: body && JSON.stringify(body)
  });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "Request failed");
  const ct = r.headers.get("Content-Type") || "";
  return ct.startsWith("audio") ? r.blob() : r.json();
}

async function upload(path, formData) {
  const r = await fetch(API + "/api/admin" + path, {
    method: "POST",
    headers: { "X-Admin-Password": password },
    body: formData
  });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "Upload failed");
  return r.json();
}

async function run(action) {
  $("msg").textContent = "Please wait...";
  try { await action(); $("msg").textContent = ""; }
  catch (e) { $("msg").textContent = e.message; }
}

function fillSelect(sel, options, value) {
  sel.replaceChildren();
  options.forEach(opt => {
    const o = document.createElement("option");
    o.value = opt;
    o.textContent = opt;
    if (opt === value) o.selected = true;
    sel.appendChild(o);
  });
}

function deviceCard(device) {
  const box = document.createElement("div");
  box.className = "box";

  const head = document.createElement("p");
  head.textContent = `${device.name}\n${device.id} - ${device.online ? "online" : "offline"}  (cfg v${device.config_version})`;
  box.appendChild(head);

  const form = document.createElement("form");
  const fields = document.createElement("div");

  function labeled(labelText, el) {
    const lab = document.createElement("label");
    lab.textContent = labelText;
    lab.appendChild(el);
    return lab;
  }
  function num(name, value, step) {
    const i = document.createElement("input");
    i.name = name; i.type = "number"; i.value = value; i.step = step || "1";
    return i;
  }
  function text(name, value) {
    const i = document.createElement("input");
    i.name = name; i.type = "text"; i.value = value;
    return i;
  }
  function sel(name, options, value) {
    const s = document.createElement("select");
    s.name = name;
    fillSelect(s, options, value);
    return s;
  }

  fields.append(
    labeled("Content URL", text("content_url", device.content_url)),
    labeled("Timezone (POSIX)", text("timezone", device.timezone)),
    (() => { const tip = document.createElement("small"); tip.textContent = "Examples: GMT0, GMT-3, WAT-1, PST8PDT,M3.2.0,M11.1.0"; return tip; })()
  );

  const geo = document.createElement("div");
  geo.className = "row";
  geo.append(labeled("Latitude", num("latitude", device.latitude, "any")),
             labeled("Longitude", num("longitude", device.longitude, "any")));
  fields.appendChild(geo);

  fields.append(
    labeled("Method", sel("method", meta.methods, device.method)),
    labeled("Asr", sel("asr", meta.asr_options, device.asr)),
    labeled("High latitude", sel("high_lat", meta.high_lat, device.high_lat))
  );

  const adj = document.createElement("div");
  adj.className = "row";
  [["adj_fajr","Fajr"],["adj_sunrise","Sunrise"],["adj_dhuhr","Dhuhr"],
   ["adj_asr","Asr"],["adj_maghrib","Maghrib"],["adj_isha","Isha"]].forEach(([k, lab]) => {
    adj.appendChild(labeled(lab + " adj", num(k, device[k])));
  });
  fields.appendChild(adj);

  const checks = document.createElement("div");
  checks.className = "checks";
  checks.appendChild(document.createTextNode("Adhan on: "));
  [["prayer_fajr","Fajr"],["prayer_dhuhr","Dhuhr"],["prayer_asr","Asr"],
   ["prayer_maghrib","Maghrib"],["prayer_isha","Isha"]].forEach(([k, lab]) => {
    const labEl = document.createElement("label");
    const c = document.createElement("input");
    c.type = "checkbox"; c.name = k; c.checked = !!device[k];
    labEl.append(c, document.createTextNode(lab));
    checks.appendChild(labEl);
  });
  fields.appendChild(checks);

  const remote = document.createElement("div");
  remote.className = "row";
  remote.append(
    labeled("Volume (-1 keep)", num("volume", device.volume)),
    labeled("Reciter (-1 keep)", num("reciter", device.reciter))
  );
  fields.appendChild(remote);

  const saveBtn = document.createElement("button");
  saveBtn.textContent = "Save device settings";
  form.append(fields, saveBtn);
  form.onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(form);
    const body = {};
    DEVICE_FIELDS.forEach(k => body[k] = fd.get(k));
    PRAYER_FIELDS.forEach(k => body[k] = form.elements[k].checked);
    body.latitude = Number(body.latitude);
    body.longitude = Number(body.longitude);
    ["volume", "reciter", ...DEVICE_FIELDS.filter(k => k.startsWith("adj_"))].forEach(k => {
      body[k] = Number(body[k]);
    });
    run(async () => {
      await call("/devices/" + device.id + "/settings", "POST", body);
      await load();
    });
  };
  box.appendChild(form);

  const remove = document.createElement("button");
  remove.type = "button";
  remove.textContent = "Remove";
  remove.onclick = () => confirm("Remove this device?") && run(async () => {
    await call("/devices/" + device.id, "DELETE"); await load();
  });
  box.appendChild(remove);
  return box;
}

async function loadAdhanStatus() {
  const el = $("adhanStatus");
  el.textContent = "Checking GitHub…";
  try {
    const d = await call("/content/adhan");
    const lines = [];
    ["adhan.mp3", "fajr.mp3"].forEach(name => {
      const f = d.files[name];
      lines.push(f ? `${name}: ${f.size} bytes (sha ${f.sha})` : `${name}: not uploaded yet`);
    });
    lines.push(`Repo ${d.repo} @ ${d.branch}`);
    el.textContent = lines.join("\n");
  } catch (e) {
    el.textContent = e.message;
  }
}

async function load() {
  const d = await call("");
  meta.methods = d.methods || meta.methods;
  meta.asr_options = d.asr_options || meta.asr_options;
  meta.high_lat = d.high_lat || meta.high_lat;
  $("keyState").textContent = d.has_key ? "(key saved)" : "(no key yet)";
  FIELDS.forEach(f => $(f).value = d.settings[f]);
  $("list").replaceChildren(...d.devices.map(deviceCard));
  loadAdhanStatus();
}

$("login").onsubmit = e => {
  e.preventDefault();
  password = $("password").value;
  run(async () => { await load(); $("login").hidden = true; $("app").hidden = false; });
};

function tab(which) {
  $("devices").hidden = which !== "devices";
  $("content").hidden = which !== "content";
  $("api").hidden = which !== "api";
  $("tabDevices").className = which === "devices" ? "on" : "";
  $("tabContent").className = which === "content" ? "on" : "";
  $("tabApi").className = which === "api" ? "on" : "";
  if (which === "content") loadAdhanStatus();
}
$("tabDevices").onclick = () => tab("devices");
$("tabContent").onclick = () => tab("content");
$("tabApi").onclick = () => tab("api");

async function uploadAdhan(kind, inputId) {
  const input = $(inputId);
  if (!input.files || !input.files[0]) throw new Error("Choose an MP3 first");
  const fd = new FormData();
  fd.append("kind", kind);
  fd.append("file", input.files[0], input.files[0].name);
  await upload("/content/adhan", fd);
  input.value = "";
  await loadAdhanStatus();
}
$("uploadAdhan").onclick = () => run(() => uploadAdhan("adhan", "fileAdhan"));
$("uploadFajr").onclick = () => run(() => uploadAdhan("fajr", "fileFajr"));

$("add").onsubmit = e => {
  e.preventDefault();
  run(async () => {
    const d = await call("/devices", "POST", { name: $("name").value });
    $("newDevice").textContent = "Copy into the Arduino code now (the token is shown only once):\n\n" +
      `#define PRODUCT_ID   "${d.product_id}"\n#define DEVICE_TOKEN "${d.token}"`;
    $("name").value = "";
    await load();
  });
};

$("config").onsubmit = e => {
  e.preventDefault();
  const body = { api_key: $("api_key").value };
  FIELDS.forEach(f => body[f] = $(f).value);
  run(async () => { await call("/config", "POST", body); $("api_key").value = ""; await load(); });
};

$("send").onclick = () => run(async () => {
  $("reply").textContent = "";
  $("reply").textContent = (await call("/test", "POST", { text: $("text").value })).answer;
});

$("speak").onclick = () => run(async () => {
  const sound = await call("/speak", "POST", { text: $("reply").textContent || $("text").value });
  const p = $("player");
  p.src = URL.createObjectURL(sound);
  p.hidden = false;
  await p.play().catch(() => {});
});
$("text").oninput = () => $("reply").textContent = "";
</script>
</body>
</html>
